<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders - ShopZone</title>
    <link rel="stylesheet" href="/shop/amazon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="shop-header"></div>

    <div class="amz-container">
        <h1 style="font-size:28px;font-weight:400;margin:16px 0">Your Orders</h1>

        <div id="success-banner" style="display:none;background:#d5f5d5;border:1px solid #90c990;padding:16px;margin-bottom:16px;border-radius:4px">
            <i class="fas fa-check-circle" style="color:#067d62"></i>
            Order placed successfully! Order ID: <strong id="placed-order-id"></strong>
        </div>

        <div id="loading" class="amz-loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>
        <div id="no-orders" style="display:none;background:white;padding:40px;text-align:center">
            <h2>No orders yet</h2>
            <a href="/shop/" class="amz-btn amz-btn-yellow" style="display:inline-block;width:auto;padding:10px 40px;margin-top:16px;text-decoration:none;color:#111">Start shopping</a>
        </div>
        <div id="orders-list"></div>
    </div>

    <div id="shop-footer"></div>

    <script src="/shop/common.js"></script>
    <script>
        const statusColors = {
            placed: '#007185', packed: '#e47911', shipped: '#e47911',
            delivered: '#067d62', cancelled: '#cc0c39'
        };

        async function loadOrders() {
            Shop.mountLayout('orders');

            const placed = new URLSearchParams(window.location.search).get('placed');
            if (placed) {
                document.getElementById('success-banner').style.display = 'block';
                document.getElementById('placed-order-id').textContent = placed;
            }

            try {
                const cid = Shop.getCustomerId();
                const res = await fetch(`/api/customers/${cid}/orders`, { headers: Shop.getAuthHeaders() });
                const data = await res.json();
                renderOrders(data.orders || []);
            } catch (e) {
                renderOrders([]);
            }
            document.getElementById('loading').style.display = 'none';
        }

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            if (!orders.length) {
                document.getElementById('no-orders').style.display = 'block';
                return;
            }

            list.innerHTML = orders.map(o => `
                <div style="background:white;padding:20px;margin-bottom:12px;border:1px solid #ddd;border-radius:4px">
                    <div style="display:flex;justify-content:space-between;background:#f0f2f2;padding:12px 16px;margin:-20px -20px 16px;font-size:12px">
                        <div><span style="color:#565959">ORDER PLACED</span><br><strong>${new Date(o.placed_at).toLocaleDateString('en-IN')}</strong></div>
                        <div><span style="color:#565959">TOTAL</span><br><strong>₹${o.total_inr.toLocaleString('en-IN')}</strong></div>
                        <div><span style="color:#565959">ORDER #</span><br><strong>${o.id}</strong></div>
                        <div style="text-align:right">
                            <a href="/shop/orders.html" style="font-size:12px">View order details</a>
                        </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <div>
                            <span style="color:${statusColors[o.status] || '#333'};font-weight:700;text-transform:capitalize">${o.status}</span>
                            <div style="font-size:14px;color:#565959;margin-top:4px">${o.items?.length || 0} item(s)</div>
                        </div>
                        <div style="display:flex;gap:8px">
                            ${o.status === 'placed' ? `<button class="amz-btn" style="width:auto;padding:6px 14px;background:#fff;border-color:#d5d9d9;border-radius:8px" onclick="cancelOrder('${o.id}')">Cancel order</button>` : ''}
                            <button class="amz-btn amz-btn-yellow" style="width:auto;padding:6px 14px;border-radius:8px" onclick="trackOrder('${o.id}')">Track package</button>
                            <button class="amz-btn" style="width:auto;padding:6px 14px;background:#fff;border-color:#d5d9d9;border-radius:8px" onclick="buyAgain('${o.id}')">Buy again</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function trackOrder(id) {
            alert('Tracking for order ' + id + ' — check Your Orders for status updates.');
        }

        function cancelOrder(id) {
            if (confirm('Cancel order ' + id + '?')) {
                alert('Cancellation request submitted.');
            }
        }

        function buyAgain() {
            window.location.href = '/shop/';
        }

        loadOrders();
    </script>
</body>
</html>
