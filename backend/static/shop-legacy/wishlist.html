<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved for later — ShopZone</title>
    <link rel="stylesheet" href="/shop/shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="shop-header"></div>
    <div class="cm-container">
        <h1 class="cm-section-title" style="text-align:left">Saved for later</h1>
        <p class="cm-section-sub" style="text-align:left">Wishlist items — move to cart when ready</p>
        <div id="empty" style="display:none;background:#fff;border:1px solid var(--cm-line);padding:40px;text-align:center">
            <p>No saved items yet.</p>
            <a href="/shop/" class="cm-btn cm-btn-dark" style="display:inline-flex;margin-top:12px">Browse electronics</a>
        </div>
        <div id="list" class="cm-grid"></div>
    </div>
    <div id="shop-footer"></div>
    <script src="/shop/common.js"></script>
    <script src="/shop/chat-widget.js"></script>
    <script>
        Shop.mountLayout('wishlist');
        function render() {
            const items = Shop.getWishlist();
            if (!items.length) {
                document.getElementById('empty').style.display = 'block';
                document.getElementById('list').innerHTML = '';
                return;
            }
            document.getElementById('empty').style.display = 'none';
            document.getElementById('list').innerHTML = items.map(p => `
                <article class="cm-card">
                    <a href="/shop/product.html?id=${p.id}">
                        <div class="cm-card-img">
                            <img src="${Shop.productImageUrl(p)}" alt="${p.title}">
                        </div>
                    </a>
                    <div class="cm-card-body">
                        <a href="/shop/product.html?id=${p.id}" class="cm-card-title">${p.title}</a>
                        <div class="cm-price">${Shop.formatPrice(p.price)}</div>
                        <div class="cm-card-actions">
                            <button class="cm-btn cm-btn-dark" onclick="Shop.addToCart('${p.id}','${p.title.replace(/'/g,"\\'")}',${p.price}); Shop.toggleWishlist('${p.id}','',''); render()">Move to cart</button>
                            <button class="cm-btn cm-btn-outline" onclick="Shop.toggleWishlist('${p.id}','',''); render()">Remove</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }
        render();
    </script>
</body>
</html>
