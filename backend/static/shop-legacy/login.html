<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ShopZone</title>
    <link rel="stylesheet" href="/shop/shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cm-promo">ShopZone · Electronics · Multi-agent shopping assistant</div>
    <header class="cm-header">
        <div class="cm-header-inner" style="grid-template-columns:1fr;justify-items:center">
            <a href="/shop/" class="cm-logo">shop<span>Zone</span></a>
        </div>
    </header>

    <div class="cm-login-wrap" id="login-panel">
        <h1>Sign in</h1>

        <div class="role-tabs">
            <button type="button" class="role-tab active" id="tab-customer" onclick="setRole('customer')">
                <i class="fas fa-user"></i> Customer
            </button>
            <button type="button" class="role-tab" id="tab-owner" onclick="setRole('owner')">
                <i class="fas fa-store"></i> Shop Owner
            </button>
        </div>

        <p id="role-hint" style="font-size:13px;color:var(--cm-muted);margin:0 0 14px">Shop as a customer — browse, order, track.</p>

        <form onsubmit="handleLogin(event)">
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Email</label>
            <input type="email" id="loginEmail" class="cm-input" required placeholder="customer@shopzone.in">
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Password</label>
            <input type="password" id="loginPassword" class="cm-input" required>
            <div id="loginError" style="display:none;color:#9b2c2c;font-size:13px;margin-bottom:12px"></div>
            <button type="submit" class="cm-btn cm-btn-dark" style="width:100%" id="loginBtn">Sign in</button>
        </form>

        <div class="demo-box" id="demo-creds">
            <strong>Demo Customer</strong><br>
            Email: <code>customer@shopzone.in</code><br>
            Password: <code>customer123</code>
        </div>

        <div style="text-align:center;margin:20px 0 8px;font-size:12px;color:var(--cm-muted)" id="register-divider">New to ShopZone?</div>
        <button class="cm-btn cm-btn-outline" style="width:100%" id="create-account-btn" onclick="showRegister()">Create account</button>
    </div>

    <div class="cm-login-wrap" id="register-panel" style="display:none">
        <h1>Create account</h1>
        <p style="font-size:13px;color:var(--cm-muted);margin:0 0 14px">Customer accounts only.</p>
        <form onsubmit="handleRegister(event)">
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Your name</label>
            <input type="text" id="registerName" class="cm-input" required>
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Email</label>
            <input type="email" id="registerEmail" class="cm-input" required>
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Password</label>
            <input type="password" id="registerPassword" class="cm-input" required minlength="6">
            <label style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Re-enter password</label>
            <input type="password" id="registerConfirm" class="cm-input" required>
            <div id="registerError" style="display:none;color:#9b2c2c;font-size:13px;margin-bottom:12px"></div>
            <button type="submit" class="cm-btn cm-btn-dark" style="width:100%" id="registerBtn">Create account</button>
        </form>
        <button class="cm-btn cm-btn-outline" style="width:100%;margin-top:12px" onclick="showLogin()">Sign in</button>
    </div>

    <footer style="text-align:center;padding:20px;font-size:12px;color:var(--cm-muted)">© 2026 ShopZone</footer>

    <script>
        let loginRole = 'customer';
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '';

        if (localStorage.getItem('auth_token') && !params.get('force')) {
            const isAdmin = localStorage.getItem('is_admin') === 'true';
            window.location.href = redirect || (isAdmin ? '/shop/admin/' : '/shop/');
        }
        if (params.get('tab') === 'register') showRegister();
        if (params.get('role') === 'owner') setRole('owner');

        function setRole(role) {
            loginRole = role;
            document.getElementById('tab-customer').classList.toggle('active', role === 'customer');
            document.getElementById('tab-owner').classList.toggle('active', role === 'owner');
            const hint = document.getElementById('role-hint');
            const demo = document.getElementById('demo-creds');
            const email = document.getElementById('loginEmail');
            const createBtn = document.getElementById('create-account-btn');
            const divider = document.getElementById('register-divider');

            if (role === 'owner') {
                hint.textContent = 'Shop Owner — manage catalogue and orders with LangGraph admin agents.';
                demo.innerHTML = `<strong>Demo Shop Owner</strong><br>Email: <code>owner@shopzone.in</code><br>Password: <code>owner123</code>`;
                email.placeholder = 'owner@shopzone.in';
                email.value = 'owner@shopzone.in';
                document.getElementById('loginPassword').value = 'owner123';
                createBtn.style.display = 'none';
                divider.style.display = 'none';
            } else {
                hint.textContent = 'Shop as a customer — browse, order, track deliveries.';
                demo.innerHTML = `<strong>Demo Customer</strong><br>Email: <code>customer@shopzone.in</code><br>Password: <code>customer123</code>`;
                email.placeholder = 'customer@shopzone.in';
                email.value = 'customer@shopzone.in';
                document.getElementById('loginPassword').value = 'customer123';
                createBtn.style.display = 'block';
                divider.style.display = 'block';
            }
        }

        setRole(loginRole);

        function showRegister() {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('register-panel').style.display = 'block';
        }
        function showLogin() {
            document.getElementById('register-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'block';
        }

        function saveSession(data) {
            localStorage.setItem('auth_token', data.access_token);
            localStorage.setItem('customer_id', data.customer_id);
            localStorage.setItem('customer_name', data.name);
            localStorage.setItem('customer_email', data.email);
            localStorage.setItem('is_admin', data.is_admin);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Signing in…';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');

                if (loginRole === 'owner' && !data.is_admin) {
                    throw new Error('This account is not a Shop Owner. Use Customer Login instead.');
                }
                if (loginRole === 'customer' && data.is_admin) {
                    throw new Error('This is a Shop Owner account. Switch to Shop Owner Login.');
                }

                saveSession(data);
                if (redirect) window.location.href = redirect;
                else if (data.is_admin) window.location.href = '/shop/admin/';
                else window.location.href = '/shop/';
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Sign in';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const err = document.getElementById('registerError');
            err.style.display = 'none';
            const pw = document.getElementById('registerPassword').value;
            if (pw !== document.getElementById('registerConfirm').value) {
                err.textContent = 'Passwords do not match';
                err.style.display = 'block';
                return;
            }
            const btn = document.getElementById('registerBtn');
            btn.disabled = true; btn.textContent = 'Creating…';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('registerEmail').value,
                        password: pw,
                        name: document.getElementById('registerName').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Registration failed');
                saveSession(data);
                window.location.href = redirect || '/shop/';
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Create account';
            }
        }
    </script>
</body>
</html>
